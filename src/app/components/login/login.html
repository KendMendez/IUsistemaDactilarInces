<div class="min-h-screen flex items-center justify-center p-4" style="background: #F8FAFC;">

  <div class="w-full max-w-md" style="animation: fadeUp 0.5s ease-out both;">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-lg shadow-blue-900/5 overflow-hidden">

      <!-- Top accent bar -->
      <div class="h-1.5" style="background: #003DA5;"></div>

      <!-- Content -->
      <div class="px-8 pt-10 pb-10">

        <!-- Logo -->
        <div class="flex justify-center mb-6">
          <div class="w-16 h-16 rounded-xl flex items-center justify-center text-white text-2xl font-bold shadow-sm" style="background: #003DA5;">
            <!-- Placeholder: reemplazar con <img src="logo.png" alt="INCES"> -->
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342" />
            </svg>
          </div>
        </div>

        <!-- Title -->
        <h1 class="text-center text-xl font-bold mb-1" style="color: #003DA5;">Sistema Dactilar INCES</h1>
        <p class="text-center text-sm mb-8" style="color: #64748B;">Ingrese sus credenciales para acceder</p>

        <!-- Error -->
        <div *ngIf="error" class="mb-5 px-4 py-3 rounded-lg text-sm flex items-center gap-3"
          style="background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA;">
          <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM8.28 7.22a.75.75 0 0 0-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 1 0 1.06 1.06L10 11.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L11.06 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L10 8.94 8.28 7.22Z" clip-rule="evenodd" />
          </svg>
          <span>{{ error }}</span>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <!-- Correo -->
          <div class="mb-5">
            <label for="correo" class="block text-sm font-medium mb-1.5" style="color: #374151;">Correo electrónico</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none" style="color: #94A3B8;">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
              </div>
              <input type="email" formControlName="correo" id="correo" placeholder="correo@ejemplo.com"
                class="w-full pl-11 pr-4 py-3 rounded-lg border transition-all duration-200 outline-none text-sm"
                style="background: #F8FAFC; border-color: #E2E8F0; color: #1E293B;"
                [class]="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched
                  ? '!border-red-400 !bg-red-50'
                  : 'focus:!border-[#003DA5] focus:!ring-2 focus:!ring-[#003DA5]/20'">
            </div>
          </div>

          <!-- Password -->
          <div class="mb-8">
            <label for="contraseña" class="block text-sm font-medium mb-1.5" style="color: #374151;">Contraseña</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none" style="color: #94A3B8;">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
              </div>
              <input type="password" formControlName="contraseña" id="contraseña" placeholder="••••••••"
                class="w-full pl-11 pr-4 py-3 rounded-lg border transition-all duration-200 outline-none text-sm"
                style="background: #F8FAFC; border-color: #E2E8F0; color: #1E293B;"
                [class]="loginForm.get('contraseña')?.invalid && loginForm.get('contraseña')?.touched
                  ? '!border-red-400 !bg-red-50'
                  : 'focus:!border-[#003DA5] focus:!ring-2 focus:!ring-[#003DA5]/20'">
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" [disabled]="loginForm.invalid || seeding"
            class="w-full py-3 rounded-lg font-semibold text-white shadow-sm transition-all duration-200 text-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-md active:scale-[0.98]"
            style="background: #003DA5;">
            <svg *ngIf="seeding" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 0 1 4 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <svg *ngIf="!seeding" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
            <span>{{ seeding ? 'Accediendo...' : 'Iniciar Sesión' }}</span>
          </button>

        </form>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs mt-6" style="color: #94A3B8;">Sistema Dactilar INCES &mdash; Acceso Seguro</p>
  </div>
</div>

<style>
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
