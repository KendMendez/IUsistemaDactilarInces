<div class="min-h-screen flex items-center justify-center relative overflow-hidden"
  style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);">

  <!-- Decorative background elements -->
  <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full opacity-10 pointer-events-none"
    style="background: radial-gradient(circle, rgba(99,102,241,0.6) 0%, transparent 70%);"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full opacity-10 pointer-events-none"
    style="background: radial-gradient(circle, rgba(139,92,246,0.6) 0%, transparent 70%);"></div>
  <div class="absolute top-[10%] right-[15%] w-[20vw] h-[20vw] rounded-full opacity-5 pointer-events-none"
    style="background: radial-gradient(circle, rgba(56,189,248,0.8) 0%, transparent 70%);"></div>

  <!-- Floating particles -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute w-1 h-1 bg-white/20 rounded-full top-[20%] left-[30%]"
      style="animation: float-particle 8s ease-in-out infinite;"></div>
    <div class="absolute w-1.5 h-1.5 bg-indigo-400/20 rounded-full top-[60%] left-[70%]"
      style="animation: float-particle 6s ease-in-out infinite 1s;"></div>
    <div class="absolute w-1 h-1 bg-purple-400/20 rounded-full top-[40%] left-[15%]"
      style="animation: float-particle 10s ease-in-out infinite 2s;"></div>
    <div class="absolute w-2 h-2 bg-sky-400/10 rounded-full top-[80%] left-[50%]"
      style="animation: float-particle 7s ease-in-out infinite 3s;"></div>
  </div>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-md mx-4"
    style="animation: card-enter 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;">

    <!-- Glass card -->
    <div class="backdrop-blur-xl rounded-3xl shadow-2xl border border-white/10 overflow-hidden"
      style="background: rgba(255,255,255,0.05);">

      <!-- Top accent gradient bar -->
      <div class="h-1 w-full" style="background: linear-gradient(90deg, #6366f1, #8b5cf6, #06b6d4);"></div>

      <!-- Card Header -->
      <div class="pt-10 pb-4 px-8 text-center">
        <!-- Logo circle -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-6 shadow-lg"
          style="background: linear-gradient(135deg, #6366f1, #8b5cf6); animation: pulse-glow 3s ease-in-out infinite;">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M7.864 4.243A7.5 7.5 0 0119.5 10.5c0 2.92-.556 5.709-1.568 8.268M5.742 6.364A7.465 7.465 0 004.5 10.5a7.464 7.464 0 01-1.15 3.993m1.989 3.559A11.209 11.209 0 008.25 10.5a3.75 3.75 0 117.5 0c0 .527-.021 1.049-.064 1.565M12 10.5a14.94 14.94 0 01-3.6 9.75m6.633-4.596a18.666 18.666 0 01-2.485 5.33" />
          </svg>
        </div>

        <h2 class="text-2xl font-bold text-white mb-1 tracking-tight">Sistema Dactilar</h2>
        <p class="text-sm text-slate-400">Ingresa tus credenciales para acceder</p>
      </div>

      <!-- Card Body / Form -->
      <div class="px-8 pb-10 pt-2">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <!-- Error alert -->
          <div *ngIf="error" class="mb-5 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-3"
            style="background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); animation: shake 0.4s ease-in-out;">
            <svg class="w-5 h-5 flex-shrink-0 text-red-400" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd" />
            </svg>
            <span>{{ error }}</span>
          </div>

          <!-- Cedula field -->
          <div class="mb-5">
            <label for="cedula" class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Cédula
              de Identidad</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 transition-colors duration-200"
                  [class]="loginForm.get('cedula')?.invalid && loginForm.get('cedula')?.touched ? 'text-red-400' : 'text-slate-500 group-focus-within:text-indigo-400'"
                  fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
              </div>
              <input type="number" formControlName="cedula" id="cedula" placeholder="Ej. 12345678"
                class="w-full pl-12 pr-4 py-3.5 rounded-xl text-white placeholder-slate-500 border transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50"
                [class]="loginForm.get('cedula')?.invalid && loginForm.get('cedula')?.touched 
                  ? 'border-red-500/50 bg-red-500/5' 
                  : 'border-white/10 bg-white/5 hover:border-white/20'">
            </div>
          </div>

          <!-- Password field -->
          <div class="mb-8">
            <label for="password"
              class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Contraseña</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 transition-colors duration-200"
                  [class]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched ? 'text-red-400' : 'text-slate-500 group-focus-within:text-indigo-400'"
                  fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
              </div>
              <input type="password" formControlName="password" id="password" placeholder="••••••••"
                class="w-full pl-12 pr-4 py-3.5 rounded-xl text-white placeholder-slate-500 border transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50"
                [class]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched 
                  ? 'border-red-500/50 bg-red-500/5' 
                  : 'border-white/10 bg-white/5 hover:border-white/20'">
            </div>
          </div>

          <!-- Submit button -->
          <button type="submit" [disabled]="loginForm.invalid || seeding"
            class="w-full py-3.5 rounded-xl font-semibold text-white shadow-lg transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed hover:shadow-indigo-500/25 hover:scale-[1.02] active:scale-[0.98]"
            style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">
            <!-- Spinner -->
            <svg *ngIf="seeding" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            <!-- Arrow icon -->
            <svg *ngIf="!seeding" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
            <span>{{ seeding ? 'Accediendo...' : 'Iniciar Sesión' }}</span>
          </button>

        </form>
      </div>
    </div>

    <!-- Footer text -->
    <p class="text-center text-xs text-slate-600 mt-6">Sistema Dactilar INCES &mdash; Acceso Seguro</p>
  </div>
</div>

<!-- Animations -->
<style>
  @keyframes card-enter {
    from {
      opacity: 0;
      transform: translateY(24px) scale(0.96);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes pulse-glow {

    0%,
    100% {
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
    }

    50% {
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.5);
    }
  }

  @keyframes float-particle {

    0%,
    100% {
      transform: translateY(0px) translateX(0px);
      opacity: 0.3;
    }

    25% {
      transform: translateY(-20px) translateX(10px);
      opacity: 0.6;
    }

    50% {
      transform: translateY(-10px) translateX(-5px);
      opacity: 0.3;
    }

    75% {
      transform: translateY(-30px) translateX(15px);
      opacity: 0.5;
    }
  }

  @keyframes shake {

    0%,
    100% {
      transform: translateX(0);
    }

    25% {
      transform: translateX(-6px);
    }

    50% {
      transform: translateX(6px);
    }

    75% {
      transform: translateX(-4px);
    }
  }

  /* Hide number input spinners */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type=number] {
    -moz-appearance: textfield;
  }
</style>
